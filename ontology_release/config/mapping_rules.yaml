policies:
  conservative_mode: true
  equivalence_threshold: 0.96
  subclass_threshold: 0.82
  close_match_threshold: 0.72
  exact_match_threshold: 0.88
  reuse_existing_external_terms: true
  forbid_cross_kind_mappings: true
  prefer_subclass_over_equivalence: true
manual_overrides:
  Agent:
    relation: rdfs:subClassOf
    target: http://www.w3.org/ns/prov#Agent
    local_kind: class
    target_label: Agent
    target_kind: class
    source: prov-o
    rationale: Agent should remain local while anchored in PROV-O.
  ElectrochemicalMeasurement:
    relation: rdfs:subClassOf
    target: https://w3id.org/emmo/domain/electrochemistry#electrochemistry_7729c34e_1ae9_403d_b933_1765885e7f29
    local_kind: class
    target_label: Electrochemical measurement
    target_kind: class
    source: emmo-electrochemistry
    rationale: H2KG electrochemical measurement is a local specialization of the reviewed EMMO electrochemical-measurement class; the broader H2KG Measurement class also covers non-electrochemical characterization.
  hasQuantityValue:
    relation: rdfs:subPropertyOf
    target: http://qudt.org/schema/qudt/quantityValue
    local_kind: object_property
    target_label: quantity value
    target_kind: object_property
    source: qudt-schema
    rationale: Quantity-value relations should reuse QUDT semantics where possible.
superseded_manual_mappings:
  - local: Measurement
    relation: rdfs:subClassOf
    target: https://w3id.org/emmo/domain/electrochemistry#electrochemistry_7729c34e_1ae9_403d_b933_1765885e7f29
    rationale: The broad H2KG Measurement class includes imaging and other non-electrochemical characterization; only ElectrochemicalMeasurement may specialize this EMMO class.
term_hints:
  quantity_value_indicators: [QuantityValue, numericValue, unit, quantityKind]
  chemical_indicators: [platinum, ionomer, solvent, oxygen, hydrogen, nafion]
  pemfc_indicators: [membrane electrode assembly, catalyst layer, gas diffusion layer, reference electrode, oxygen transport]
  hdo_indicators: [data, dataset, metadata, identifier, pid, record, schema, validation, digital object, information profile, provenance]
source_preferences:
  data_management: [hdo, prov-o, dcterms]
  publication_metadata: [prov-o, dcterms, vann]
  scientific_process: [emmo-core, emmo-electrochemistry]
