        canonical_role_iri: https://w3id.org/h2kg/hydrogen-ontology#Manufacturing
      - id: workflow_or_analysis
        pattern: '(protocol|fitting|simulation|model|analysis|extraction|reconstruction|classification|mechanism|rate law|calculation)'
        canonical_role_iri: https://w3id.org/h2kg/hydrogen-ontology#Process
      - id: operating_or_geometric_parameter
        pattern: '(temperature|pressure|flow|humidification|mole fraction|stoichiometr|rotation rate|clamping|geometry|\barea\b|\bvolume\b|\bmass\b|loading|ratio|fraction|concentration|frequency|amplitude|scan rate|duration)'
        canonical_role_iri: https://w3id.org/h2kg/hydrogen-ontology#Parameter
      - id: physical_or_derived_property
        pattern: '(thickness|porosity|permeability|conductivity|resistance|diffusivity|tortuosity|saturation|density|surface tension|contact angle|activity|utilization|capacitance|potential|current|rate|energy|coefficient|coverage|radius|pore size|morphology|structure|sorption|mobility|alignment|dispersion|corrosion|diffusion|oxidation state|coordination number|bond distance|interaction strength|tafel slope|\bph\b|collection efficiency|youngs modulus|mechanical strength|kinetic parameters)'
