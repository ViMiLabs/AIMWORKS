ontology:
  title: DECODE H2KG-Aligned Workflow Ontology
  ontology_iri: https://w3id.org/h2kg/decode/ontology
  version: 1.0.0
  issued: 2026-09-23
  definition_status: expert-draft
  definition_seed_sha256: 1655e3c3724b1318607a16f977aa8cef8408500805f956a68f4ccc4466e9c838
  definition_seed_note: >-
    Curated from the DECODE concept-definition draft supplied for expert review;
    generic placeholders and source-category role errors are not authoritative.

definition_candidate_registry: decode_definition_candidates.json

# These definitions cover source labels absent from the supplied draft and
# concepts whose scientific distinction should not be left to a generic rule.
# All remain expert drafts pending DECODE domain review.
definition_overrides:
  "0D Particle population degradation model coupled with performance model fitting": >-
    A coupled zero-dimensional computational process that estimates catalyst-particle degradation and electrochemical-performance model parameters from observed cell behavior.
  "0D Particle population degradation model coupled with performance model prediction": >-
    A coupled zero-dimensional computational process that predicts electrochemical performance from an evolving catalyst-particle population and its degradation state.
  "0D Particle population degradation model prediction": >-
    A zero-dimensional computational process that predicts changes in catalyst-particle populations under a specified electrochemical degradation protocol.
  "Adsorbate conformation on electrode (nanostructured)": >-
    A structured data representation of the spatial arrangement and orientation of adsorbed species at a nanostructured electrode-electrolyte interface.
  "CCL 2D TEM images raw": >-
    A raw two-dimensional transmission-electron-microscopy image dataset acquired from a cathode catalyst layer before segmentation or quantitative image analysis.
  "Cell H2 outlet pressure": >-
    An operating parameter specifying the hydrogen pressure measured or imposed at the outlet of an electrochemical cell.
  "CL protonic resistance": >-
    An analysis process that derives catalyst-layer protonic resistance or conductivity from electrochemical impedance spectroscopy data and associated cell conditions.
  "Confocal Laser Scanning Microscope (CLSM) + fluorescent probes for local pH assessment in acidic media on model electrodes": >-
    A fluorescence-assisted confocal-laser-scanning-microscopy measurement that determines spatially resolved local pH near model electrodes in acidic electrolyte.
  "Degradation rate of cell voltage": >-
    A derived property expressing the rate of change of electrochemical-cell voltage with operating time or accumulated degradation exposure.
  "dip-and-pull operando or in-situ XPS": >-
    An operando or in-situ X-ray photoelectron spectroscopy measurement in which controlled electrode immersion and withdrawal enable surface-state analysis under near-reaction conditions.
  "Electrochemical cell testing": >-
    A measurement procedure that applies controlled electrical and operating conditions to an electrochemical cell and records its performance or diagnostic response.
  "In Situ Fourier Transformed IR in ATR configuration nanostructured": >-
    An in-situ attenuated-total-reflectance Fourier-transform infrared spectroscopy measurement of interfacial species on a nanostructured electrode.
  "IRRAS operando or in-situ FTIR": >-
    An operando or in-situ infrared-reflection-absorption spectroscopy measurement used to identify surface and interfacial species during electrochemical operation.
  "Linear Sweep Voltammetry": >-
    A data artifact containing current or current density as a function of a linearly swept electrode potential under defined electrochemical conditions.
  "LRE species distribution (nanostructured)": >-
    A spatially resolved data representation of chemical-species abundance near a nanostructured local-reaction-environment electrode.
  "Machine learning force fields": >-
    A computational modeling process that uses data-trained interatomic potentials to approximate quantum-mechanical energies and forces in atomistic simulations.
  "Measurement of PTL porosity and contact angle": >-
    A characterization measurement that determines pore-volume fraction and wetting contact angle for a porous transport layer.
  "Molecular Dynamics for the Electrode | Electrolyte Interface - MetalWalls": >-
    A molecular-dynamics simulation process using MetalWalls to model molecular structure and dynamics at a constant-potential electrode-electrolyte interface.
  "Molecular Dynamics for the Electrode | Electrolyte Interface in presence of ionomer": >-
    A molecular-dynamics simulation process that models electrode-electrolyte interfacial structure and transport in the presence of an ionomer phase.
  "N2 Adsorption Ex-Situ PSD": >-
    An ex-situ nitrogen-physisorption measurement used to derive the pore-size distribution and related surface-area characteristics of a porous material.
  "OER/HER Catalyst Activity in Alkaline Conditions": >-
    An electrochemical measurement of oxygen-evolution or hydrogen-evolution catalyst activity in alkaline electrolyte under controlled test conditions.
  "operando or in-situ XAS photon-out": >-
    An operando or in-situ photon-out X-ray absorption spectroscopy measurement that probes absorber coordination and electronic structure during electrochemical operation.
  "operando SAXS or WAXS small or wide angle X-ray spectroscopy": >-
    An operando small- or wide-angle X-ray scattering measurement that tracks nanoscale structure or crystalline ordering during electrochemical operation.
  "PEMFC 4-fold Cell Benchtop Test": >-
    A benchtop proton-exchange-membrane fuel-cell measurement performed with a four-fold cell configuration to compare electrochemical performance under controlled conditions.
  "PEWE Large-Scale Durability Test": >-
    A durability measurement that exposes a proton-exchange-membrane water-electrolysis system to sustained or cycled operation at application-relevant scale.
  "PEWE Single Cell Benchtop Test": >-
    A benchtop measurement of a single proton-exchange-membrane water-electrolysis cell under controlled electrical, thermal, pressure, and flow conditions.
  "Porous Transport Layer Bulk Resistance": >-
    A measurement procedure used to determine the through-body or in-plane electrical resistance of a porous transport layer under defined contact and compression conditions.
  "PTL bulk resistance": >-
    An electrical property representing resistance to charge transport through the bulk of a porous transport layer under specified conditions.
  "PTL Contact Angle": >-
    A wetting property representing the equilibrium or apparent contact angle of a probe liquid on a porous transport layer surface.
  "StarDist-TEM nanoparticle segmentation": >-
    An image-analysis process that applies a StarDist model to segment individual nanoparticles in transmission-electron-microscopy images.
  "StarPlatin-TEM nanoparticle segmentation": >-
    An image-analysis process that applies the StarPlatin workflow to identify and segment platinum nanoparticles in transmission-electron-microscopy images.
  "TEM and EDS analysis of CL": >-
    A combined transmission-electron-microscopy and energy-dispersive-X-ray-spectroscopy measurement of catalyst-layer morphology and elemental distribution.
  "thin windows operando or in-situ XPS": >-
    An operando or in-situ X-ray photoelectron spectroscopy measurement using an electron-transparent window arrangement to probe interfaces under controlled environments.
